<h2>顶部布局：Tab + 搜索框样式</h2>
<p class="subtitle">选择每个分类顶部的搜索框呈现方式</p>

<div class="cards">
  <div class="card" data-choice="inline-search" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background:#1a1a2e;color:#e0e0e0;border-radius:12px;padding:0;overflow:hidden;max-width:360px;margin:0 auto">
        <div style="background:#0f0f1a;padding:4px 12px;font-size:10px;color:#888">9:41</div>
        <!-- Search bar row -->
        <div style="padding:8px 12px 4px;display:flex;gap:8px;align-items:center">
          <div style="flex:1;background:#2a2a3e;border-radius:20px;padding:8px 14px;display:flex;align-items:center;gap:6px">
            <span style="color:#888;font-size:12px">🔍</span>
            <span style="color:#666;font-size:12px">搜索影片、演员...</span>
          </div>
        </div>
        <!-- Tab row -->
        <div style="display:flex;gap:4px;padding:6px 12px 8px;border-bottom:1px solid #2a2a3e">
          <span style="background:#5c6bc0;color:white;padding:4px 12px;border-radius:16px;font-size:12px">有码</span>
          <span style="color:#888;padding:4px 8px;font-size:12px;background:#2a2a3e;border-radius:16px">无码</span>
          <span style="color:#888;padding:4px 8px;font-size:12px;background:#2a2a3e;border-radius:16px">高清</span>
          <span style="color:#888;padding:4px 8px;font-size:12px;background:#2a2a3e;border-radius:16px">字幕</span>
        </div>
        <!-- Content -->
        <div style="padding:12px;min-height:120px">
          <div style="background:#2a2a3e;border-radius:8px;padding:12px;margin-bottom:8px;display:flex;gap:8px">
            <div style="width:50px;height:70px;background:#3a3a4e;border-radius:4px"></div>
            <div><div style="width:120px;height:10px;background:#3a3a4e;border-radius:4px;margin-bottom:6px"></div><div style="width:80px;height:8px;background:#3a3a4e;border-radius:4px"></div></div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>A. 搜索框在上，Tab 在下</h3>
      <p>搜索框占满一行，Tab 在下方横向排列。点击搜索框展开搜索页。</p>
    </div>
  </div>

  <div class="card" data-choice="compact-search" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background:#1a1a2e;color:#e0e0e0;border-radius:12px;padding:0;overflow:hidden;max-width:360px;margin:0 auto">
        <div style="background:#0f0f1a;padding:4px 12px;font-size:10px;color:#888">9:41</div>
        <!-- Tab row with search at the end -->
        <div style="display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid #2a2a3e;align-items:center">
          <span style="background:#5c6bc0;color:white;padding:4px 12px;border-radius:16px;font-size:12px;white-space:nowrap">有码</span>
          <span style="color:#888;padding:4px 8px;font-size:12px;background:#2a2a3e;border-radius:16px;white-space:nowrap">无码</span>
          <span style="color:#888;padding:4px 8px;font-size:12px;background:#2a2a3e;border-radius:16px;white-space:nowrap">高清</span>
          <span style="color:#888;padding:4px 8px;font-size:12px;background:#2a2a3e;border-radius:16px;white-space:nowrap">字幕</span>
          <div style="flex:1;background:#2a2a3e;border-radius:20px;padding:6px 10px;display:flex;align-items:center;gap:4px;margin-left:4px">
            <span style="color:#888;font-size:10px">🔍</span>
            <span style="color:#666;font-size:10px">搜索...</span>
          </div>
        </div>
        <!-- Content -->
        <div style="padding:12px;min-height:120px">
          <div style="background:#2a2a3e;border-radius:8px;padding:12px;margin-bottom:8px;display:flex;gap:8px">
            <div style="width:50px;height:70px;background:#3a3a4e;border-radius:4px"></div>
            <div><div style="width:120px;height:10px;background:#3a3a4e;border-radius:4px;margin-bottom:6px"></div><div style="width:80px;height:8px;background:#3a3a4e;border-radius:4px"></div></div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>B. Tab 和搜索框同行</h3>
      <p>Tab 在左，搜索框填满右侧剩余空间。更紧凑，但 Tab 多时搜索框会被压缩。</p>
    </div>
  </div>

  <div class="card" data-choice="expandable-search" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background:#1a1a2e;color:#e0e0e0;border-radius:12px;padding:0;overflow:hidden;max-width:360px;margin:0 auto">
        <div style="background:#0f0f1a;padding:4px 12px;font-size:10px;color:#888">9:41</div>
        <!-- Collapsed: search icon + tabs -->
        <div style="display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid #2a2a3e;align-items:center">
          <div style="color:#5c6bc0;font-size:18px;margin-right:4px">🔍</div>
          <span style="background:#5c6bc0;color:white;padding:4px 12px;border-radius:16px;font-size:12px">有码</span>
          <span style="color:#888;padding:4px 8px;font-size:12px">无码</span>
          <span style="color:#888;padding:4px 8px;font-size:12px">高清</span>
          <span style="color:#888;padding:4px 8px;font-size:12px">字幕</span>
        </div>
        <!-- Content -->
        <div style="padding:12px;min-height:120px">
          <div style="background:#2a2a3e;border-radius:8px;padding:12px;margin-bottom:8px;display:flex;gap:8px">
            <div style="width:50px;height:70px;background:#3a3a4e;border-radius:4px"></div>
            <div><div style="width:120px;height:10px;background:#3a3a4e;border-radius:4px;margin-bottom:6px"></div><div style="width:80px;height:8px;background:#3a3a4e;border-radius:4px"></div></div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>C. 搜索图标 + 点击展开搜索框</h3>
      <p>默认只显示搜索图标，点击后搜索框从顶部滑出展开（类似 Google 搜索栏交互）。最节省空间。</p>
    </div>
  </div>
</div>
