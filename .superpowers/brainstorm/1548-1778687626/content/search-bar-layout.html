<h2>搜尋入口樣式對比</h2>
<p class="subtitle">目前：Tab 右側只有一個小搜尋圖標，右側空白較多</p>

<div class="cards">
  <div class="card" data-choice="current" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background:#1a1a2e;color:#e0e0e0;padding:0;border-radius:8px;overflow:hidden;font-family:system-ui">
        <div style="display:flex;align-items:center;padding:8px 12px;gap:0;border-bottom:1px solid #333">
          <div style="display:flex;gap:16px;flex:1">
            <span style="font-weight:bold;color:#8b9cf7;font-size:14px">有碼</span>
            <span style="color:#999;font-size:14px">無碼</span>
            <span style="color:#999;font-size:14px">高清</span>
            <span style="color:#999;font-size:14px">字幕</span>
          </div>
          <div style="width:40px;height:40px;border-radius:50%;background:#2a2a3e;display:flex;align-items:center;justify-content:center;margin-right:4px">
            <span style="font-size:16px">🔍</span>
          </div>
        </div>
        <div style="padding:40px 16px;text-align:center;color:#555;font-size:13px">
          ↑ 右側大片空白
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>A. 現狀：圖標按鈕</h3>
      <p>搜尋圖標太小，右側浪費空間</p>
    </div>
  </div>

  <div class="card" data-choice="pill" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background:#1a1a2e;color:#e0e0e0;padding:0;border-radius:8px;overflow:hidden;font-family:system-ui">
        <div style="display:flex;align-items:center;padding:8px 12px;gap:0;border-bottom:1px solid #333">
          <div style="display:flex;gap:16px;flex-shrink:0">
            <span style="font-weight:bold;color:#8b9cf7;font-size:14px">有碼</span>
            <span style="color:#999;font-size:14px">無碼</span>
          </div>
          <div style="flex:1;margin-left:16px">
            <div style="background:#2a2a3e;border-radius:20px;padding:8px 14px;display:flex;align-items:center;gap:8px;border:1px solid #3a3a4e">
              <span style="font-size:14px">🔍</span>
              <span style="color:#666;font-size:13px">搜尋</span>
            </div>
          </div>
        </div>
        <div style="padding:40px 16px;text-align:center;color:#555;font-size:13px">
          搜尋框填滿右側空白
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>B. 膠囊搜尋框（推薦）</h3>
      <p>圓角膠囊造型，點擊跳轉搜尋頁，填滿空白區域</p>
    </div>
  </div>

  <div class="card" data-choice="outlined" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background:#1a1a2e;color:#e0e0e0;padding:0;border-radius:8px;overflow:hidden;font-family:system-ui">
        <div style="display:flex;align-items:center;padding:8px 12px;gap:0;border-bottom:1px solid #333">
          <div style="display:flex;gap:16px;flex-shrink:0">
            <span style="font-weight:bold;color:#8b9cf7;font-size:14px">有碼</span>
            <span style="color:#999;font-size:14px">無碼</span>
          </div>
          <div style="flex:1;margin-left:16px">
            <div style="background:transparent;border-radius:8px;padding:8px 14px;display:flex;align-items:center;gap:8px;border:1px solid #4a4a5e">
              <span style="font-size:14px">🔍</span>
              <span style="color:#666;font-size:13px">搜尋</span>
            </div>
          </div>
        </div>
        <div style="padding:40px 16px;text-align:center;color:#555;font-size:13px">
          描邊風格搜尋框
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>C. 描邊搜尋框</h3>
      <p>帶邊框的矩形搜尋框，視覺層次更分明</p>
    </div>
  </div>

  <div class="card" data-choice="compact-pill" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="background:#1a1a2e;color:#e0e0e0;padding:0;border-radius:8px;overflow:hidden;font-family:system-ui">
        <div style="display:flex;align-items:center;padding:8px 12px;gap:0;border-bottom:1px solid #333">
          <div style="display:flex;gap:16px;flex-shrink:0">
            <span style="font-weight:bold;color:#8b9cf7;font-size:14px">有碼</span>
            <span style="color:#999;font-size:14px">無碼</span>
            <span style="color:#999;font-size:14px">高清</span>
            <span style="color:#999;font-size:14px">字幕</span>
          </div>
          <div style="margin-left:auto;margin-right:4px">
            <div style="background:#2a2a3e;border-radius:20px;padding:6px 12px;display:flex;align-items:center;gap:6px">
              <span style="font-size:13px">🔍</span>
              <span style="color:#666;font-size:12px">搜尋</span>
            </div>
          </div>
        </div>
        <div style="padding:40px 16px;text-align:center;color:#555;font-size:13px">
          小尺寸膠囊，不擠壓 Tab
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>D. 緊湊膠囊</h3>
      <p>不佔 Tab 空間，僅填補 Tab 右側到螢幕邊的間隙</p>
    </div>
  </div>
</div>
