<h2>🔽 筛选 Bottom Sheet</h2>
<p class="subtitle">从收藏列表顶部点击「筛选」按钮弹出</p>

<div class="section">
  <div class="label">内容类型</div>
  <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px;">
    <div class="option" data-choice="type-all" onclick="toggleSelect(this)" style="display: inline-flex; padding: 8px 20px; border-radius: 20px; border: 2px solid #444; cursor: pointer; font-size: 14px; background: var(--card-bg);">
      全部
    </div>
    <div class="option" data-choice="type-censored" onclick="toggleSelect(this)" style="display: inline-flex; padding: 8px 20px; border-radius: 20px; border: 2px solid #444; cursor: pointer; font-size: 14px; background: var(--card-bg);">
      有碼
    </div>
    <div class="option" data-choice="type-uncensored" onclick="toggleSelect(this)" style="display: inline-flex; padding: 8px 20px; border-radius: 20px; border: 2px solid #444; cursor: pointer; font-size: 14px; background: var(--card-bg);">
      無碼
    </div>
  </div>
</div>

<div class="section" style="margin-top: 24px;">
  <div class="label">发布日期</div>
  <div style="margin-top: 8px;">
    <div style="font-size: 12px; color: #999; margin-bottom: 6px;">年份（从收藏数据中动态提取）</div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <div class="option" data-choice="pub-2026" onclick="toggleSelect(this)" style="display: inline-flex; padding: 6px 16px; border-radius: 16px; border: 2px solid #444; cursor: pointer; font-size: 13px; background: var(--card-bg);">2026</div>
      <div class="option" data-choice="pub-2025" onclick="toggleSelect(this)" style="display: inline-flex; padding: 6px 16px; border-radius: 16px; border: 2px solid #444; cursor: pointer; font-size: 13px; background: var(--card-bg);">2025</div>
      <div class="option" data-choice="pub-2024" onclick="toggleSelect(this)" style="display: inline-flex; padding: 6px 16px; border-radius: 16px; border: 2px solid #444; cursor: pointer; font-size: 13px; background: var(--card-bg);">2024</div>
      <div class="option" data-choice="pub-2023" onclick="toggleSelect(this)" style="display: inline-flex; padding: 6px 16px; border-radius: 16px; border: 2px solid #444; cursor: pointer; font-size: 13px; background: var(--card-bg);">2023</div>
      <div class="option" data-choice="pub-older" onclick="toggleSelect(this)" style="display: inline-flex; padding: 6px 16px; border-radius: 16px; border: 2px solid #444; cursor: pointer; font-size: 13px; background: var(--card-bg);">更早</div>
    </div>
    <div style="font-size: 12px; color: #999; margin-top: 10px; margin-bottom: 6px;">月份（可选，选择年份后显示）</div>
    <div style="display: flex; gap: 6px; flex-wrap: wrap;">
      <div class="option" data-choice="pub-m-all" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #555; cursor: pointer; font-size: 12px; background: var(--card-bg);">全部</div>
      <div class="option" data-choice="pub-m1" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #555; cursor: pointer; font-size: 12px; background: var(--card-bg);">1月</div>
      <div class="option" data-choice="pub-m2" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #555; cursor: pointer; font-size: 12px; background: var(--card-bg);">2月</div>
      <div class="option" data-choice="pub-m3" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #555; cursor: pointer; font-size: 12px; background: var(--card-bg);">3月</div>
      <div class="option" data-choice="pub-m4" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #555; cursor: pointer; font-size: 12px; background: var(--card-bg);">4月</div>
      <div class="option" data-choice="pub-m5" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #555; cursor: pointer; font-size: 12px; background: var(--card-bg);">5月</div>
      <div class="option" data-choice="pub-m6" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #555; cursor: pointer; font-size: 12px; background: var(--card-bg);">6月</div>
      <div class="option" data-choice="pub-m7" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #555; cursor: pointer; font-size: 12px; background: var(--card-bg);">7月</div>
      <div class="option" data-choice="pub-m8" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #555; cursor: pointer; font-size: 12px; background: var(--card-bg);">8月</div>
      <div class="option" data-choice="pub-m9" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #555; cursor: pointer; font-size: 12px; background: var(--card-bg);">9月</div>
      <div class="option" data-choice="pub-m10" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #555; cursor: pointer; font-size: 12px; background: var(--card-bg);">10月</div>
      <div class="option" data-choice="pub-m11" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #555; cursor: pointer; font-size: 12px; background: var(--card-bg);">11月</div>
      <div class="option" data-choice="pub-m12" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #555; cursor: pointer; font-size: 12px; background: var(--card-bg);">12月</div>
    </div>
  </div>
</div>

<div class="section" style="margin-top: 24px;">
  <div class="label">收藏时间</div>
  <div style="margin-top: 8px;">
    <div style="font-size: 12px; color: #999; margin-bottom: 6px;">年份（从收藏数据中动态提取）</div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <div class="option" data-choice="col-2026" onclick="toggleSelect(this)" style="display: inline-flex; padding: 6px 16px; border-radius: 16px; border: 2px solid #444; cursor: pointer; font-size: 13px; background: var(--card-bg);">2026</div>
      <div class="option" data-choice="col-2025" onclick="toggleSelect(this)" style="display: inline-flex; padding: 6px 16px; border-radius: 16px; border: 2px solid #444; cursor: pointer; font-size: 13px; background: var(--card-bg);">2025</div>
      <div class="option" data-choice="col-2024" onclick="toggleSelect(this)" style="display: inline-flex; padding: 6px 16px; border-radius: 16px; border: 2px solid #444; cursor: pointer; font-size: 13px; background: var(--card-bg);">2024</div>
      <div class="option" data-choice="col-older" onclick="toggleSelect(this)" style="display: inline-flex; padding: 6px 16px; border-radius: 16px; border: 2px solid #444; cursor: pointer; font-size: 13px; background: var(--card-bg);">更早</div>
    </div>
  </div>
</div>

<div style="display: flex; gap: 12px; margin-top: 32px; padding-top: 16px; border-top: 1px solid #333;">
  <button style="flex: 1; padding: 12px; border-radius: 12px; border: 1px solid #555; background: transparent; color: #ccc; cursor: pointer; font-size: 15px;">重置</button>
  <button style="flex: 2; padding: 12px; border-radius: 12px; border: none; background: #6750A4; color: white; cursor: pointer; font-size: 15px;">应用筛选</button>
</div>
