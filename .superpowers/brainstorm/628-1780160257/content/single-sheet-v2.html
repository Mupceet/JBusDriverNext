<h2>收藏筛选 Bottom Sheet（合并版）</h2>
<p class="subtitle">点击筛选按钮弹出一个面板，顶部含重置+排序，筛选即时生效</p>

<!-- Top bar: Reset + Sort dropdown -->
<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
  <div style="color: #D0BCFF; font-size: 14px; cursor: pointer;">重置</div>
  <div style="position: relative; display: inline-flex; align-items: center; gap: 4px; padding: 6px 14px; border-radius: 8px; border: 1px solid #555; background: var(--card-bg); cursor: pointer; font-size: 14px; color: #ccc;">
    排序: 收藏时间 ↓ 新→旧
    <span style="font-size: 10px;">▾</span>
  </div>
</div>

<!-- Sort dropdown expanded (shown when tapping sort) -->
<div style="display: none; margin-bottom: 20px; padding: 8px; border-radius: 10px; border: 1px solid #555; background: var(--card-bg);" id="sort-dropdown">
  <div style="padding: 10px 12px; border-radius: 8px; background: rgba(103,80,164,0.2); color: #D0BCFF; font-size: 14px; margin-bottom: 2px;">收藏时间 ↓ 新→旧</div>
  <div style="padding: 10px 12px; border-radius: 8px; font-size: 14px; color: #ccc; margin-bottom: 2px;">收藏时间 ↑ 旧→新</div>
  <div style="padding: 10px 12px; border-radius: 8px; font-size: 14px; color: #ccc; margin-bottom: 2px;">发布日期 ↓ 新→旧</div>
  <div style="padding: 10px 12px; border-radius: 8px; font-size: 14px; color: #ccc;">发布日期 ↑ 旧→新</div>
</div>

<div style="margin-bottom: 24px;">
  <div class="label">内容类型</div>
  <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px;">
    <div class="option" data-choice="type-all" onclick="toggleSelect(this)" style="display: inline-flex; padding: 8px 20px; border-radius: 20px; border: 2px solid #6750A4; cursor: pointer; font-size: 14px; background: rgba(103,80,164,0.15); color: #D0BCFF;">
      全部
    </div>
    <div class="option" data-choice="type-censored" onclick="toggleSelect(this)" style="display: inline-flex; padding: 8px 20px; border-radius: 20px; border: 2px solid #444; cursor: pointer; font-size: 14px; background: var(--card-bg);">
      有碼
    </div>
    <div class="option" data-choice="type-uncensored" onclick="toggleSelect(this)" style="display: inline-flex; padding: 8px 20px; border-radius: 20px; border: 2px solid #444; cursor: pointer; font-size: 14px; background: var(--card-bg);">
      無碼
    </div>
  </div>
</div>

<div class="section" style="margin-bottom: 24px;">
  <div class="label">发布日期</div>
  <div style="margin-top: 8px;">
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <div class="option" data-choice="pub-all" onclick="toggleSelect(this)" style="display: inline-flex; padding: 6px 16px; border-radius: 16px; border: 2px solid #6750A4; cursor: pointer; font-size: 13px; background: rgba(103,80,164,0.15); color: #D0BCFF;">全部</div>
      <div class="option" data-choice="pub-2026" onclick="toggleSelect(this)" style="display: inline-flex; padding: 6px 16px; border-radius: 16px; border: 2px solid #444; cursor: pointer; font-size: 13px; background: var(--card-bg);">2026</div>
      <div class="option" data-choice="pub-2025" onclick="toggleSelect(this)" style="display: inline-flex; padding: 6px 16px; border-radius: 16px; border: 2px solid #444; cursor: pointer; font-size: 13px; background: var(--card-bg);">2025</div>
      <div class="option" data-choice="pub-2024" onclick="toggleSelect(this)" style="display: inline-flex; padding: 6px 16px; border-radius: 16px; border: 2px solid #444; cursor: pointer; font-size: 13px; background: var(--card-bg);">2024</div>
      <div class="option" data-choice="pub-2023" onclick="toggleSelect(this)" style="display: inline-flex; padding: 6px 16px; border-radius: 16px; border: 2px solid #444; cursor: pointer; font-size: 13px; background: var(--card-bg);">2023</div>
      <div class="option" data-choice="pub-older" onclick="toggleSelect(this)" style="display: inline-flex; padding: 6px 16px; border-radius: 16px; border: 2px solid #444; cursor: pointer; font-size: 13px; background: var(--card-bg);">更早</div>
    </div>
    <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px;">
      <div class="option" data-choice="pubm-all" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #6750A4; cursor: pointer; font-size: 12px; background: rgba(103,80,164,0.15); color: #D0BCFF;">全部</div>
      <div class="option" data-choice="pubm-1" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #555; cursor: pointer; font-size: 12px; background: var(--card-bg);">1月</div>
      <div class="option" data-choice="pubm-2" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #555; cursor: pointer; font-size: 12px; background: var(--card-bg);">2月</div>
      <div class="option" data-choice="pubm-3" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #555; cursor: pointer; font-size: 12px; background: var(--card-bg);">3月</div>
      <div class="option" data-choice="pubm-4" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #555; cursor: pointer; font-size: 12px; background: var(--card-bg);">4月</div>
      <div class="option" data-choice="pubm-5" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #555; cursor: pointer; font-size: 12px; background: var(--card-bg);">5月</div>
      <div class="option" data-choice="pubm-6" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #555; cursor: pointer; font-size: 12px; background: var(--card-bg);">6月</div>
      <div class="option" data-choice="pubm-7" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #555; cursor: pointer; font-size: 12px; background: var(--card-bg);">7月</div>
      <div class="option" data-choice="pubm-8" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #555; cursor: pointer; font-size: 12px; background: var(--card-bg);">8月</div>
      <div class="option" data-choice="pubm-9" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #555; cursor: pointer; font-size: 12px; background: var(--card-bg);">9月</div>
      <div class="option" data-choice="pubm-10" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #555; cursor: pointer; font-size: 12px; background: var(--card-bg);">10月</div>
      <div class="option" data-choice="pubm-11" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #555; cursor: pointer; font-size: 12px; background: var(--card-bg);">11月</div>
      <div class="option" data-choice="pubm-12" onclick="toggleSelect(this)" style="display: inline-flex; padding: 4px 12px; border-radius: 12px; border: 1px solid #555; cursor: pointer; font-size: 12px; background: var(--card-bg);">12月</div>
    </div>
  </div>
</div>

<div class="section">
  <div class="label">收藏时间</div>
  <div style="margin-top: 8px;">
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <div class="option" data-choice="col-all" onclick="toggleSelect(this)" style="display: inline-flex; padding: 6px 16px; border-radius: 16px; border: 2px solid #6750A4; cursor: pointer; font-size: 13px; background: rgba(103,80,164,0.15); color: #D0BCFF;">全部</div>
      <div class="option" data-choice="col-2026" onclick="toggleSelect(this)" style="display: inline-flex; padding: 6px 16px; border-radius: 16px; border: 2px solid #444; cursor: pointer; font-size: 13px; background: var(--card-bg);">2026</div>
      <div class="option" data-choice="col-2025" onclick="toggleSelect(this)" style="display: inline-flex; padding: 6px 16px; border-radius: 16px; border: 2px solid #444; cursor: pointer; font-size: 13px; background: var(--card-bg);">2025</div>
      <div class="option" data-choice="col-2024" onclick="toggleSelect(this)" style="display: inline-flex; padding: 6px 16px; border-radius: 16px; border: 2px solid #444; cursor: pointer; font-size: 13px; background: var(--card-bg);">2024</div>
      <div class="option" data-choice="col-older" onclick="toggleSelect(this)" style="display: inline-flex; padding: 6px 16px; border-radius: 16px; border: 2px solid #444; cursor: pointer; font-size: 13px; background: var(--card-bg);">更早</div>
    </div>
  </div>
</div>
